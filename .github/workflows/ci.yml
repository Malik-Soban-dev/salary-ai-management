name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty

      - name: Cypress typecheck
        run: npx tsc -p cypress --noEmit

      - name: Unit tests (finance engine + domain)
        run: npm test

      # SAST/secret scanning join here before launch (04_ARCH §8 security baseline).

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (incl. Cypress binary)
        run: npm ci

      - name: Start API + demo client
        run: |
          npm run dev:api > /tmp/api.log 2>&1 &
          npx --yes wait-on http://localhost:3000/health --timeout 90000
          cat /tmp/api.log

      - name: Run Cypress (JSON reporter under xvfb)
        id: cypress
        run: |
          set +e
          xvfb-run -a npx cypress run --reporter json > /tmp/cypress.json 2>/tmp/cypress.err
          code=$?
          echo "cypress exit code: $code"
          python3 scripts/parse_cypress_json.py /tmp/cypress.json 2>/tmp/parse.err || true
          if [ -s /tmp/parse.err ]; then
            echo "::error title=parser::$(head -c 250 /tmp/parse.err | tr '\n' ' ')"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error title=cypress-exit::$code"
            echo "::error title=cypress-stderr::$(tail -c 350 /tmp/cypress.err | tr '\n' ' ')"
          fi
          test "$code" -eq 0

      - name: Post diagnostics to tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Cypress diagnostics — run ${{ github.run_id }} (${GITHUB_SHA::7})"
            echo
            echo '```text'
            echo "=== /tmp/cypress.err (first 3KB) ==="
            tr -d '\000' < /tmp/cypress.err | head -c 3000 || true
            echo
            echo "=== /tmp/parse.err (first 3KB) ==="
            head -c 3000 /tmp/parse.err 2>/dev/null || true
            echo
            echo "=== /tmp/cypress.json (first 60KB) ==="
            head -c 60000 /tmp/cypress.json 2>/dev/null || echo "(missing)"
            echo
            echo "=== /tmp/api.log (last 3KB) ==="
            tail -c 3000 /tmp/api.log || true
            echo '```'
          } > /tmp/body.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Report API log tail on failure
        if: failure()
        run: echo "::error title=api-log-tail::$(tail -c 400 /tmp/api.log | tr '\n' ' ')"
