name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty

      - name: Cypress typecheck
        run: npx tsc -p cypress --noEmit

      - name: Unit tests (finance engine + domain)
        run: npm test

      # SAST/secret scanning join here before launch (04_ARCH §8 security baseline).

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (incl. Cypress binary)
        run: npm ci

      - name: Start API + demo client
        run: |
          npm run dev:api > /tmp/api.log 2>&1 &
          npx --yes wait-on http://localhost:3000/health --timeout 90000
          cat /tmp/api.log

      - name: Run Cypress (JSON reporter)
        id: cypress
        run: |
          set +e
          npx cypress run --reporter json > /tmp/cypress.json 2>/tmp/cypress.err
          code=$?
          echo "cypress exit code: $code"
          python3 scripts/parse_cypress_json.py /tmp/cypress.json || true
          # Keep raw output for the summary even when the run passes
          tail -c 2000 /tmp/cypress.err || true
          test "$code" -eq 0

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Dump API log on failure
        if: failure()
        run: tail -100 /tmp/api.log
